    nombre: "FraSoHome · Plataforma de agentes"
    alias: fs-plataforma-agentes
    miembros: [admin, david]
  tiendas:
    nombre: "FraSoHome · Responsables de tienda"
    alias: fs-responsables-tienda
    miembros: [jorge, alvaro]

atributo:
  conjunto: FraSoHome
  nombre: Carril
  descripcion: Carril de gobierno del agente (Bizz Summit 2026)
