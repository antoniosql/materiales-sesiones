    nombre: Asistente de Devoluciones FraSoHome     # nombre visible del agente en Copilot Studio
    sponsor_inicial: marta                            # estado de partida de la demo 1
    sponsors_arreglo: [jorge, grupo:tiendas]          # demo 4, beat 3
