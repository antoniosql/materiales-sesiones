    roles:
      - { rol: Storage Blob Data Reader, contenedor: buzon-devoluciones }
      - { rol: Storage Blob Data Contributor, contenedor: triage-resultados }

acceso_condicional:
  CA-AG-01:
    nombre: "CA-AG-01 · Agentes de Producción con riesgo alto → bloquear"
    carril: Produccion
    riesgo: high
    recursos: [All]
  CA-AG-02:
    nombre: "CA-AG-02 · Agentes de Playground → sin recursos de producción"
    carril: Playground
    # Azure Storage (aplicación de primera parte). Añade aquí otros recursos de producción.
    recursos: [e406a681-f3d4-42a8-90b6-c2b029497af1]

workflow:
  nombre: LW-Mover-Sponsors
  descripcion: "Cambio de departamento de un sponsor: avisa al manager (con copia a Tiendas) y a los co-sponsors. No transfiere."
  copia_a: [jorge]

foundry:
  conexion: fs-devoluciones-mcp
  server_label: fs-devoluciones
  instrucciones: >-
    Eres el asistente de devoluciones online de FraSoHome. Para cualquier pregunta con cifras de
    devoluciones usa la herramienta devoluciones_online. Los datos cubren 2024 y 2025: si el usuario
    no da fechas, usa todo el histórico y dilo. Si la herramienta devuelve un error, muéstralo tal
    cual, sin inventar cifras.
  pregunta_demo: ¿Cuántas devoluciones online de iluminación tenemos registradas y por qué motivo?
