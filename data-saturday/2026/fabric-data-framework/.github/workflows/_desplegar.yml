# Workflow reutilizable: despliega un entorno completo. Lo llaman deploy.yml y deploy-prod.yml.
# Cada GitHub Environment (dev, test, prod) define:
#   vars:    AZURE_CLIENT_ID, AZURE_TENANT_ID, WS_DATOS_ID, WS_ING_ID, WS_ANA_ID, ENV_FWK_ID
#   prod:    revisores obligatorios (protección del environment en GitHub)
name: _desplegar

on:
  workflow_call:
    inputs:
      entorno:
        type: string
        required: true

permissions: {}

jobs:
  desplegar:
    name: Desplegar en ${{ inputs.entorno }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.entorno }}
    concurrency: despliegue-${{ inputs.entorno }}
    permissions:
      id-token: write  # OIDC con el service principal, sin secretos
      contents: read
    env:
      ENTORNO: ${{ inputs.entorno }}
      WS_DATOS_ID: ${{ vars.WS_DATOS_ID }}
      WS_ING_ID: ${{ vars.WS_ING_ID }}
      WS_ANA_ID: ${{ vars.WS_ANA_ID }}
      ENV_FWK_ID: ${{ vars.ENV_FWK_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install build -e ".[deploy]"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: 1 · Publicar configuración y contratos en OneLake
        run: python scripts/publicar_config.py --entorno "$ENTORNO"
      - name: 2 · Construir y publicar la librería en el Environment
        run: |
          python -m build --wheel
          python scripts/publicar_libreria.py --wheel "dist/*.whl"
      - name: 3 · Desplegar items de Fabric
        run: python scripts/desplegar.py --entorno "$ENTORNO"
