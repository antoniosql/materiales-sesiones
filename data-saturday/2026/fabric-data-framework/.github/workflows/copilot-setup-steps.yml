# Prepara el entorno del agente de código de GitHub Copilot antes de que empiece a trabajar,
# para que pueda ejecutar los mismos linters y tests que CI (scripts/agente_lint.py, pre-commit, pytest).
# GitHub exige que el job se llame exactamente 'copilot-setup-steps'.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions: {}

concurrency:
  group: copilot-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copilot-setup-steps:
    name: Entorno del agente de Copilot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
      - name: Dependencias de desarrollo y linters
        run: |
          pip install -e ".[dev]"
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          pre-commit install-hooks
        env:
          GITHUB_TOKEN: ${{ github.token }}
