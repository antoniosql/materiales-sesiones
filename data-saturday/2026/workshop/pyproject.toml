[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datafwk"
version = "0.3.0"
description = "Librería común del framework de ingeniería de datos y analítica en Microsoft Fabric"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# pyspark y delta ya vienen en el runtime de Fabric: solo se instalan en local
dev = [
  "pyspark==3.5.*",
  "delta-spark==3.3.2",
  "jsonschema>=4",
  "pytest>=8",
  "python-dotenv",
  "pre-commit>=4",
  "ruff>=0.17",
  "mypy>=2.4",
  "types-PyYAML",
  "sqlfluff>=4.5",
  "yamllint>=1.38",
  "check-jsonschema>=0.39",
  "actionlint-py",  # binario de actionlint, para que scripts/agente_lint.py lo encuentre
  "zizmor>=1.31",
]
deploy = ["fabric-cicd", "azure-identity", "azure-storage-file-datalake", "requests", "python-dotenv"]
export = ["mssql-python>=1.16", "azure-cosmos>=4", "azure-identity", "python-dotenv"]

[tool.hatch.build.targets.wheel]
packages = ["src/datafwk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "spark: necesita una SparkSession local",
  "delta: necesita las extensiones Delta locales y Java 17",
  "integration: se ejecuta contra un workspace de Fabric (solo en el pipeline de despliegue)",
]
addopts = "-m 'not integration'"

# ----------------------------------------------------------------------------- Ruff (lint + formato)
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["templates"]
force-exclude = true  # para que pre-commit también respete las exclusiones
# Variables que el runtime de Fabric inyecta en los notebooks
builtins = ["spark", "sc", "notebookutils", "mssparkutils", "display"]

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle y pyflakes
  "I",            # orden de imports
  "B",            # bugs probables
  "UP",           # sintaxis moderna
  "N",            # nombres
  "SIM", "C4",    # simplificaciones
  "PT",           # estilo pytest
  "RUF",          # reglas propias de Ruff
  "S",            # seguridad (equivalente a bandit)
  "T20",          # print() fuera de sitio
]
ignore = [
  "N812",    # 'functions as F' es la convención de PySpark
  "N818",    # nombres de excepción en español, sin sufijo Error
  "RUF001",  # texto en español con caracteres tipográficos
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]                                 # assert es la forma de comprobar en pytest
"scripts/**" = ["T20"]                                # los scripts informan por consola
# Notebooks: imports tras la celda de parámetros, print como salida y el espaciado que escribe Fabric al sincronizar
"fabric/**/notebook-content.py" = ["E402", "T20", "W291", "W293"]

[tool.ruff.format]
# Los notebooks se revisan con 'ruff check' pero no se formatean: Fabric reescribe el fichero en cada
# sincronización y un formateo distinto provocaría cambios fantasma en cada commit desde el workspace.
exclude = ["fabric/**"]

# ----------------------------------------------------------------------------- mypy (solo la librería)
[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
pretty = true

[[tool.mypy.overrides]]
# Sin stubs fiables fuera de Fabric: se tratan como Any en local, en pre-commit y en CI por igual
module = ["pyspark", "pyspark.*", "delta", "delta.*", "notebookutils"]
ignore_missing_imports = true
follow_imports = "skip"
