[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semdebt"
version = "1.0.0"
description = "Demos reproducibles de la sesión Semantic Debt (Microsoft 365 Live 2026) sobre el caso FraSoHome"
requires-python = ">=3.10"
dependencies = [
  "msal>=1.31", "requests>=2.32", "python-dotenv>=1.0", "pyyaml>=6.0", "pandas>=2.2",
  "python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1",
]

[project.optional-dependencies]
agent = ["microsoft-agents-copilotstudio-client>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
semdebt = "semdebt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
